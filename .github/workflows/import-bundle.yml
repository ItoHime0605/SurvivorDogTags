name: Import bundled source and compile NeoForge JAR
on:
  push:
    branches: [main]
    paths:
      - 'bootstrap/source.tar.xz'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract project source
        run: |
          set -euo pipefail
          test -f bootstrap/source.tar.xz
          mkdir -p /tmp/survivordogtags-project
          tar -xJf bootstrap/source.tar.xz -C /tmp/survivordogtags-project --no-same-owner
          test -f /tmp/survivordogtags-project/build.gradle
          cp -a /tmp/survivordogtags-project/. ./
          test -f src/main/java/tw/zonezero/survivordogtags/SurvivorDogTags.java
      - name: Commit extracted project to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: import complete SurvivorDogTags 0.1.9-alpha source"
            git push
          fi
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Run independent source tests
        run: bash tools/test_local.sh
      - name: Build NeoForge mod JAR
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee build/gradle-build.log
      - name: Verify built JAR
        run: python3 tools/verify_jar.py
      - name: Upload compiler log even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-0.1.9-alpha-Compiler-Log
          path: build/gradle-build.log
          if-no-files-found: ignore
      - name: Upload verified installable mod
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-0.1.9-alpha-JAR
          path: build/libs/*.jar
          if-no-files-found: error
