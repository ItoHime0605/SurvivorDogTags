name: Build SurvivorDogTags NeoForge 1.21.1 JAR
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - name: Checkout complete source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Verify independent rules and assets
        run: bash tools/test_local.sh
      - name: Compile NeoForge mod
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee build/gradle-build.log
      - name: Verify installable JAR contents
        run: python3 tools/verify_jar.py
      - name: Upload compiler logs on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-0.1.10-alpha-Compiler-Log
          path: build/gradle-build.log
          if-no-files-found: ignore
      - name: Upload checked JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-0.1.10-alpha-JAR
          path: build/libs/*.jar
          if-no-files-found: error
