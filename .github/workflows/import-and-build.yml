name: Import source ZIP and build JAR
on:
  push:
    branches: [main]
    paths:
      - 'SurvivorDogTags-*-src.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract the uploaded original source ZIP
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(SurvivorDogTags-*-src.zip)
          if (( ${#archives[@]} != 1 )); then
            echo "::error::Expected one SurvivorDogTags-*-src.zip in repository root."
            exit 1
          fi
          archive="${archives[0]}"
          python3 - "$archive" <<'PY'
          import sys, zipfile
          from pathlib import Path
          archive=Path(sys.argv[1])
          out=Path("/tmp/survivordogtags-import")
          out.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive) as z:
              files=z.namelist()
              if any(".." in Path(f).parts or f.startswith("/") for f in files):
                  raise SystemExit("Unsafe paths in archive")
              z.extractall(out)
          children=[p for p in out.iterdir() if p.is_dir()]
          if len(children)!=1 or not (children[0]/"build.gradle").is_file():
              raise SystemExit("ZIP must contain the original SurvivorDogTags project folder")
          root=children[0]
          import shutil
          for entry in root.iterdir():
              dest=Path.cwd()/entry.name
              if entry.name==".git": continue
              if dest.exists():
                  if dest.is_dir(): shutil.rmtree(dest)
                  else: dest.unlink()
              if entry.is_dir(): shutil.copytree(entry,dest)
              else: shutil.copy2(entry,dest)
          PY
          rm -- "$archive"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "feat: import SurvivorDogTags 0.1.9-alpha source"
          git push

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'

      - name: Run local smoke tests
        run: bash tools/test_local.sh

      - name: Build NeoForge JAR
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          gradle build --no-daemon --console=plain --stacktrace 2>&1 | tee build/gradle-build.log

      - name: Verify compiled JAR
        run: python3 tools/verify_jar.py

      - name: Upload Gradle build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-compiler-logs
          path: build/gradle-build.log
          if-no-files-found: ignore

      - name: Upload verified installable JAR
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SurvivorDogTags-0.1.9-alpha-JAR
          path: build/libs/*.jar
          if-no-files-found: error
