plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
group = mod_group_id
version = mod_version
base { archivesName = 'SurvivorDogTags' }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
repositories {
    exclusiveContent {
        forRepository {
            maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}
neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { "${mod_id}" { sourceSet(sourceSets.main) } }
}
// The mod dependencies are compile-time only. Never embed other mods into our JAR.
dependencies {
    compileOnly('maven.modrinth:vvuO3ImH:yohfFbgD') { transitive = false } // Curios 9.5.1
    compileOnly('maven.modrinth:OypNE65K:62q6mB5Q') { transitive = false } // TaCZ 1.1.8-hotfix-r7
}
var generateMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
                 neo_version: neo_version, loader_version_range: loader_version_range,
                 mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license]
    inputs.properties props
    expand props
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateMetadata
neoForge.ideSyncTask generateMetadata
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
